name: Tu214 CAD runtime check
on:
  push:
    branches: [work/tu214-v3-cad-check]
    paths: [.github/workflows/tu214-rebuild.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cadquery==2.7.0 matplotlib scipy
      - name: Check OpenCascade and original panel
        run: |
          python - <<'PY'
          import cadquery as cq, hashlib
          from pathlib import Path
          p=Path('tu214-sidewall/cad/tu214_sidewall_original.step')
          s=cq.importers.importStep(str(p)).val()
          print('SOURCE_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          print('SOURCE_VALID',s.isValid(),'SOLIDS',len(s.Solids()),'VOLUME',s.Volume())
          assert s.isValid() and len(s.Solids())==1
          PY
