name: Tu214 local corner and mounting correction
on:
  push:
    branches: [work/tu214-window-v6]
    paths:
      - window-local-revision-v6/*.py
      - window-local-revision-v6/parameters.json
      - .github/workflows/tu214-window-v6.yml
permissions:
  contents: write
concurrency:
  group: tu214-window-v6
  cancel-in-progress: true
jobs:
  local-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: window-revision-v5/requirements.txt
      - run: python -m pip install -r window-revision-v5/requirements.txt
      - name: Measure panel reference and apply only local changes
        run: |
          python -u window-local-revision-v6/diagnose.py
          if test -f window-local-revision-v6/build.py; then
            python -u window-local-revision-v6/build.py
          fi
      - name: Save geometry and control images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- window-local-revision-v6
          if ! git diff --cached --quiet; then
            git commit -m 'Save local cup corner correction and 7 mm handle mounting verification'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tu214-window-local-v6
          path: window-local-revision-v6
          retention-days: 7
