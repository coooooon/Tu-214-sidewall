name: Tu214 corrected window CAD
on:
  push:
    branches: [work/tu214-v3-cad-check]
    paths:
      - corrected-window-v3/**
      - .github/workflows/tu214-rebuild.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tu214-cad-v3
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: corrected-window-v3/requirements.txt
      - run: python -m pip install -r corrected-window-v3/requirements.txt
      - name: Build separate BRep components and preserve source panel
        run: python -u corrected-window-v3/build.py
      - name: Validate STEP geometry and full motion
        run: python -u corrected-window-v3/validate.py
      - name: Render required orthographic views and sections
        run: python -u corrected-window-v3/render.py
      - name: Save checked outputs in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- corrected-window-v3
          if ! git diff --cached --quiet; then
            git commit -m 'Save checked Tu-214 cup, shade, handle and STEP assemblies'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tu214-corrected-window-v3
          path: corrected-window-v3
          retention-days: 7
