name: Tu214 analytical formed cup and scaled handle
on:
  push:
    branches: [work/tu214-window-v5]
    paths:
      - window-revision-v5/build.py
      - window-revision-v5/parameters.json
      - window-revision-v5/requirements.txt
      - .github/workflows/tu214-window-v5.yml
permissions:
  contents: write
concurrency:
  group: tu214-window-v5
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: window-revision-v5/requirements.txt
      - run: python -m pip install -r window-revision-v5/requirements.txt
      - name: Build analytical geometry and verify STEP and assembly views
        run: python -u window-revision-v5/build.py
      - name: Save generated CAD and verification images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- window-revision-v5
          if ! git diff --cached --quiet; then
            git commit -m 'Save analytical cup with visible R10 flange blend and 120x30x15 handle'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tu214-window-revision-v5
          path: window-revision-v5
          retention-days: 7
